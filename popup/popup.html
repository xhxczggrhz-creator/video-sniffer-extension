<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频嗅探器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 顶栏 -->
  <div class="header">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="#FF6B35" stroke-width="2"/>
        <path d="M12 22V12M2 7l10 5 10-5" stroke="#FF6B35" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" fill="#FF6B35"/>
      </svg>
      <span>视频嗅探器</span>
    </div>
    <button id="rescan-btn" class="icon-btn" title="重新扫描页面">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 11-6.219-8.56"/>
        <path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>

  <!-- 状态栏 -->
  <div id="status-bar" class="status-bar">
    <span class="status-dot scanning"></span>
    <span id="status-text">正在嗅探视频…</span>
  </div>

  <!-- v4.3.1 录制倍速选择（借鉴 CocoCut timectr.js 思路：加速 playbackRate
       缩短实际录制时间。原速 200KB/s 受源码率限制,加速后实际录制时长
       = 视频时长/N,数据率不变但总耗时减少。默认 8x 推荐平衡值） -->
  <div id="record-options" class="record-options">
    <span class="record-options-label">录制倍速</span>
    <select id="record-speed" class="record-speed-select">
      <option value="1">1x 原速（有声）</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
      <option value="8" selected>8x（推荐）</option>
    </select>
    <span class="record-options-hint">加速后实际录制时长 = 视频时长 ÷ N</span>
  </div>

  <!-- 视频列表 -->
  <div id="video-list" class="video-list"></div>

  <!-- 空状态 -->
  <div id="empty-state" class="empty-state" style="display:none;">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="6" width="14" height="12" rx="2"/>
        <path d="M16 10l6-4v12l-6-4"/>
      </svg>
    </div>
    <p>暂未检测到视频</p>
    <p class="hint">在页面上播放视频后，点击右上角刷新按钮</p>
  </div>

  <!-- 底栏 -->
  <div class="footer">
    <button id="clear-btn" class="text-btn">清空列表</button>
    <button id="privacy-btn" class="text-btn text-btn-danger">清除所有痕迹</button>
    <span class="privacy-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L4 7v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V7l-8-5z"/>
      </svg>
      隐私保护 · 无 P2P
    </span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
