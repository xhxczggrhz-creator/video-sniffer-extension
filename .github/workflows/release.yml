name: Release

# 打 tag 即自动出 Release（附可下载的扩展 zip + SHA256）。
# 这样发版流程收敛成：改版本号 → 写 CHANGELOG → 打 tag 推送，其余全自动。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 门禁（语法 / 单元 / 安全 / 国际化）
        run: |
          node scripts/check-js.js
          npm test
          node tests/test-ssrf-p03.js
          node scripts/i18n-check.js

      - name: 版本一致性（manifest 必须等于 tag）
        run: |
          VER=$(node -e "console.log(require('./manifest.json').version)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::manifest.json 版本 ($VER) 与 tag ($TAG) 不一致"
            exit 1
          fi
          echo "版本一致：$VER"

      - name: 打包（zip + SHA256，与 ci.yml 同口径）
        run: |
          VER=$(node -e "console.log(require('./manifest.json').version)")
          mkdir -p dist
          zip -r "dist/video-sniffer-${VER}.zip" \
            manifest.json _locales background content icons lib offscreen popup LICENSE README.md \
            -x '*/drm-service/*' '*/node_modules/*' '*/\.*'
          cd dist && sha256sum "video-sniffer-${VER}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --generate-notes 是按 PR 聚合的；本仓库全是直接 push、没有 PR，
      # 它只会产出一行 compare 链接 —— 等于 Release 没有正文，CHANGELOG
      # 里写的内容根本读不到。改为直接取 CHANGELOG 的本版段落。
      # 取不到段落/段落为空时回退 --generate-notes，不让发版因此失败。
      - name: 从 CHANGELOG 取本版 Release 正文
        run: |
          node -e 'const fs=require("fs");const ver=require("./manifest.json").version;const lines=fs.readFileSync("CHANGELOG.md","utf8").split(/\r?\n/);const s=lines.findIndex(l=>l.startsWith("## ["+ver+"]"));if(s<0){console.log("CHANGELOG 无 "+ver+" 段落，回退 --generate-notes");process.exit(0);}let e=lines.findIndex((l,i)=>i>s&&l.startsWith("## ["));if(e<0)e=lines.length;const body=lines.slice(s+1,e).join("\n").trim();if(!body){console.log("段落为空，回退 --generate-notes");process.exit(0);}fs.writeFileSync("dist/NOTES.md",body+"\n");console.log("Release 正文取自 CHANGELOG，共 "+body.split("\n").length+" 行");'

      - name: 创建 Release 并附上产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -e "console.log(require('./manifest.json').version)")
          NOTES="--generate-notes"
          if [ -s dist/NOTES.md ]; then NOTES="--notes-file dist/NOTES.md"; fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/video-sniffer-${VER}.zip" dist/SHA256SUMS.txt \
            --title "v${VER}" $NOTES
          echo "RELEASE_URL $(gh release view "$GITHUB_REF_NAME" --json url -q .url)"
